# ============================================================
# Thesa AI — Render Blueprint Infrastructure as Code
# Auto-deploys Docker Container to Singapore Region
#
# Setup:
#   1. Set secret env vars via Render dashboard Environment tab:
#      DEEPSEEK_API_KEY, GEMINI_API_KEY, MIDTRANS_SERVER_KEY,
#      MIDTRANS_CLIENT_KEY, REDIS_URL, ADMIN_SECRET_KEY
#   2. Untuk Redis: gunakan Render Redis add-on atau Upstash
# ============================================================

services:
  - type: web
    name: thesa-ai
    env: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: python_api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: AI_PRIMARY_PROVIDER
        value: deepseek
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: MIDTRANS_IS_PRODUCTION
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      # ── Secret vars (set via Render Dashboard) ──
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_CLIENT_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: CLOUDMERSIVE_API_KEY
        sync: false
